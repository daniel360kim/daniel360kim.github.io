<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <script>(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    {% if page.image %}
    <meta property="og:image" content="{{ page.image | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ page.image | absolute_url }}">
    {% else %}
    <meta name="twitter:card" content="summary">
    {% endif %}
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="{{ '/assets/script.js' | relative_url }}" defer></script>
    {% if page.layout == "post" %}
    <script>
      window.MathJax = { tex: { inlineMath: [["$", "$"]], displayMath: [["$$", "$$"]] } };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js" defer></script>
    {% endif %}
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="{{ '/index.html' | relative_url }}" class="site-title">Daniel Kim</a>
                <div class="nav-links">
                    <a href="{{ '/index.html' | relative_url }}">About</a>
                    <a href="{{ '/projects.html' | relative_url }}">Projects</a>
                    <a href="{{ '/publications.html' | relative_url }}">Publications</a>
                    <a href="{{ '/blog.html' | relative_url }}"{% if page.url contains '/blog' %} class="active"{% endif %}>Blog</a>
                    <button id="theme-toggle">🌙 Dark Mode</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        {{ content }}
    </main>

    <footer class="container" style="padding: 20px 0; text-align: center;">
        <p>&copy; 2026 Daniel Kim.</p>
    </footer>
</body>
</html>
